<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Live Draw</title>
  <!-- Google Fonts: Shantell Sans (clean handwriting) and Inter (clean sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Patrick+Hand&family=Shantell+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
  <div id="app-container">
    <!-- Collapsible Flat Header Toolbar -->
    <header id="toolbar">
      <div class="toolbar-group brand-section">
        <!-- AI Draw SVG Logo -->
        <div class="app-logo">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="26" height="26" rx="6" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="32 4" />
            <path d="M8 20L19 9L23 13L12 24L7 25L8 20Z" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" />
            <path d="M17 11L21 15" stroke="#f59e0b" stroke-width="1.8" />
            <circle cx="23" cy="9" r="2.5" fill="#22c55e" />
            <path d="M10 10L14 10" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </div>
        <span class="brand-title">AI Draw</span>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Quick Canvas Tools -->
      <div class="toolbar-group">
        <button class="tool-btn active" data-tool="select" title="Select / Move / Resize (V)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 18 3-7 7-3L3 3z"/></svg>
          <span>Select</span>
        </button>
        <button class="tool-btn" data-tool="pan" title="Pan Canvas (H / Space+Drag)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8M6 14v-1a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6a7 7 0 0 0 7 7h3a8 8 0 0 0 8-8v-5a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2"/></svg>
          <span>Pan</span>
        </button>
        <button class="tool-btn" data-tool="arrow" title="Connect Arrow (A)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          <span>Arrow</span>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          <span>Erase</span>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Undo & Redo -->
      <div class="toolbar-group">
        <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
        <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)">↷</button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Zoom -->
      <div class="toolbar-group">
        <button class="icon-btn" id="btn-zoom-out" title="Zoom Out">−</button>
        <span id="zoom-level">100%</span>
        <button class="icon-btn" id="btn-zoom-in" title="Zoom In">+</button>
        <button class="icon-btn" id="btn-fit" title="Fit to Content">[ ]</button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Font, Grid & Theme Toggles -->
      <div class="toolbar-group">
        <button class="action-btn" id="btn-font-toggle" title="Switch Font (applies to selected node or board)">
          <span id="font-label">✍ Shantell</span>
        </button>
        <button class="action-btn" id="btn-grid" title="Switch Grid Style">
          <span class="label">▦ Graph</span>
        </button>
        <button class="action-btn" id="btn-theme" title="Toggle Dark/Light Mode">
          🌙 <span class="label">Dark</span>
        </button>
      </div>

      <div class="toolbar-spacer"></div>

      <!-- Right Tools: Status, Export, Panel Toggle, Hide Menu -->
      <div class="toolbar-group">
        <div id="status-pill" title="Watching workspace diagram file">
          <span id="status-dot"></span>
          <span id="status-text">AI Live</span>
        </div>
        <button class="action-btn" id="btn-export" title="Export High-Res PNG">PNG</button>
        <button class="action-btn active" id="btn-toggle-sidebar" title="Toggle Right Sidebar">
          <span>⚙ Panel</span>
        </button>
        <button class="icon-btn" id="btn-hide-toolbar" title="Hide Toolbar">▲</button>
      </div>
    </header>

    <!-- Floating Re-open Toolbar Button -->
    <button id="btn-show-toolbar" title="Show Toolbar">▼</button>

    <!-- Main Workspace (Canvas on Left/Center, Sidebar strictly on Right) -->
    <div id="workspace">
      <!-- Infinite Whiteboard Canvas -->
      <main id="canvas-container">
        <canvas id="canvas"></canvas>

        <!-- Pure In-Place Frameless Direct Inline Text Editor (Overlays directly on node text) -->
        <div id="inline-text-editor-container" style="display: none;">
          <textarea id="inline-text-editor" spellcheck="false" placeholder="Type text here..."></textarea>
          <div class="inline-editor-hint">Press Esc or click outside to finish</div>
        </div>
      </main>

      <!-- Right-Side Inspector & Shapes Sidebar -->
      <aside id="inspector-sidebar">
        <!-- Sidebar Tabs -->
        <div class="sidebar-tabs">
          <button class="tab-btn active" data-tab="shapes">Shapes</button>
          <button class="tab-btn" data-tab="files">Diagrams</button>
        </div>

        <!-- Tab 1: Shapes Palette (Drag & Drop or Click to morph selected) -->
        <div class="tab-pane active" id="tab-shapes">
          <div class="pane-title">Shapes & Palette</div>
          <div class="pane-subhint">Click to morph selected node, or drag onto canvas</div>

          <div class="shapes-grid">
            <button class="shape-card" draggable="true" data-shape="card" title="Drag to canvas or click to morph selected">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/></svg>
              <span>Step Card</span>
            </button>
            <button class="shape-card" draggable="true" data-shape="decision" title="Drag to canvas or click to morph selected">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 12 12 22 2 12 12 2"/></svg>
              <span>Decision</span>
            </button>
            <button class="shape-card" draggable="true" data-shape="sticky" title="Drag to canvas or click to morph selected">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"/><path d="M15 3v6h6"/></svg>
              <span>Sticky Note</span>
            </button>
            <button class="shape-card" draggable="true" data-shape="database" title="Drag to canvas or click to morph selected">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
              <span>Database</span>
            </button>
            <button class="shape-card" draggable="true" data-shape="cloud" title="Drag to canvas or click to morph selected">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
              <span>Cloud</span>
            </button>
            <button class="shape-card" draggable="true" data-shape="circle" title="Drag to canvas or click to morph selected">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
              <span>Circle</span>
            </button>
            <button class="shape-card" draggable="true" data-shape="capsule" title="Drag to canvas or click to morph selected">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="5"/></svg>
              <span>Capsule</span>
            </button>
            <button class="shape-card" draggable="true" data-shape="queue" title="Drag to canvas or click to morph selected">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="1"/><line x1="8" y1="6" x2="8" y2="18"/><line x1="14" y1="6" x2="14" y2="18"/></svg>
              <span>Queue</span>
            </button>
            <button class="shape-card" draggable="true" data-shape="actor" title="Drag to canvas or click to morph selected">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
              <span>User / Actor</span>
            </button>
          </div>

          <!-- Quick Selected Node Styling -->
          <div class="selected-styling-section">
            <div class="pane-title" style="margin-top: 10px;">Color Palette</div>
            <div class="color-swatches" id="color-swatches">
              <button class="swatch default" data-color="default" title="Default"></button>
              <button class="swatch blue" data-color="blue" title="Blue"></button>
              <button class="swatch green" data-color="green" title="Green"></button>
              <button class="swatch amber" data-color="amber" title="Amber"></button>
              <button class="swatch purple" data-color="purple" title="Purple"></button>
              <button class="swatch rose" data-color="rose" title="Rose"></button>
              <button class="swatch yellow" data-color="yellow" title="Yellow"></button>
            </div>

            <div class="pane-title" style="margin-top: 14px;">Status Badge</div>
            <div class="status-buttons">
              <button class="status-btn" data-status="none">None</button>
              <button class="status-btn" data-status="todo">Todo</button>
              <button class="status-btn" data-status="active">Active</button>
              <button class="status-btn" data-status="completed">Done</button>
            </div>

            <div class="pane-title" style="margin-top: 14px;">Node Font</div>
            <div class="font-buttons">
              <button class="font-btn active" data-font="handwritten">✍ Shantell</button>
              <button class="font-btn" data-font="sans">Clean Sans</button>
            </div>

            <div class="inspector-actions" style="margin-top: 16px;">
              <button class="action-btn" id="btn-duplicate-node">Duplicate</button>
              <button class="action-btn danger" id="btn-delete-node">Delete (Ctrl+Z Undo)</button>
            </div>
          </div>
        </div>

        <!-- Tab 2: Diagram Files Manager -->
        <div class="tab-pane" id="tab-files">
          <div class="pane-header-row">
            <div class="pane-title">Diagram Files</div>
            <button class="action-btn" id="btn-new-file">+ New</button>
          </div>
          <div id="diagrams-list" class="diagrams-list">
            <!-- Dynamically populated -->
          </div>
          <div class="pane-hint">Files are stored independently in this project's .aidraw/</div>
        </div>
      </aside>
    </div>
  </div>

  <script src="webview.js"></script>
</body>
</html>
